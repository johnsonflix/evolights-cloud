# EvoLights Mosquitto configuration
# Two listeners: plain on 1883 (internal/dev), TLS on 8883 (devices + production).
# All access requires username + password. ACL file scopes per-device topic access.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Auth ---
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- Listener: plain TCP, internal only ---
listener 1883
protocol mqtt

# --- Listener: TLS, public ---
# To enable: drop fullchain.pem + privkey.pem into ./mosquitto/certs/ and uncomment.
# listener 8883
# protocol mqtt
# cafile   /mosquitto/certs/fullchain.pem
# certfile /mosquitto/certs/fullchain.pem
# keyfile  /mosquitto/certs/privkey.pem
# require_certificate false
# tls_version tlsv1.2
